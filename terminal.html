<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Floor Workspace | ApexForex Terminal</title>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { background-color: #06080c; color: #d1d5db; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
        .grid-layout { display: grid; grid-template-columns: 320px 1fr 340px; height: calc(100vh - 48px); }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #1f2937; }
    </style>
</head>
<body class="overflow-hidden select-none">

    <!-- Top Navigation Header Desk -->
    <header class="bg-gray-900 border-b border-gray-800 h-12 px-4 flex justify-between items-center text-xs">
        <div class="flex items-center space-x-6">
            <span class="font-black text-blue-500 tracking-wider text-sm">APEX<span class="text-white font-light">FX-5</span></span>
            <div class="flex space-x-4 border-l border-gray-800 pl-4 text-gray-400">
                <div>ID: <span id="hdr-user-id" class="text-yellow-500 font-bold">...</span></div>
                <div>Leverage: <span id="hdr-leverage" class="text-gray-300">...</span></div>
            </div>
        </div>
        <div class="flex items-center space-x-6 font-bold text-gray-300">
            <div>BAL: <span id="hdr-bal" class="text-green-400">$0.00</span></div>
            <div>EQUITY: <span id="hdr-eq" class="text-white">$0.00</span></div>
            <a href="funding.html" class="bg-emerald-950 text-emerald-400 border border-emerald-900 px-2 py-1 rounded hover:bg-emerald-800 transition">💰 FUNDS</a>
            <a href="settings.html" class="bg-gray-800 hover:bg-gray-700 text-gray-300 border border-gray-700 px-2 py-1 rounded transition">⚙️ SETTINGS</a>
            <button onclick="terminateSession()" class="bg-red-950 text-red-400 border border-red-900 px-2 py-1 rounded hover:bg-red-900 hover:text-white transition">LOGOUT</button>
        </div>
    </header>

    <div class="grid-layout">
        <!-- Market Watch Matrix -->
        <aside class="bg-gray-950 border-r border-gray-800 flex flex-col">
            <div class="p-2 bg-gray-900 text-[11px] font-bold text-gray-400 border-b border-gray-800 flex justify-between">
                <span>Symbol Matrix</span>
                <span>Bid/Ask Spread</span>
            </div>
            <div class="flex-1 overflow-y-auto divide-y divide-gray-900">
                <div class="p-3 flex justify-between items-center bg-gray-900 bg-opacity-40 border-l-2 border-blue-500">
                    <div>
                        <p class="font-bold text-sm text-white">EURUSD</p>
                        <p class="text-[10px] text-gray-500">Euro / US Dollar</p>
                    </div>
                    <div class="text-right">
                        <p id="mt-eurusd" class="text-sm font-bold text-green-400">1.09421</p>
                        <p class="text-[10px] text-gray-500 font-mono">0.3 pips</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Dynamic Chart Floor -->
        <main class="flex flex-col bg-black">
            <div class="flex-1 p-4 relative flex flex-col">
                <div class="flex justify-between items-center mb-2 text-xs border-b border-gray-900 pb-2">
                    <span class="text-white font-bold text-sm">EURUSD, M1 Live Candle Stream</span>
                    <span class="text-gray-400 text-[11px]">C: <span id="current-candle-c">1.09421</span></span>
                </div>
                <div class="flex-1 min-h-0 relative">
                    <canvas id="mt5EngineChart"></canvas>
                </div>
            </div>

            <!-- Ledger Terminal Open Order Sheet -->
            <div class="h-56 bg-gray-950 border-t border-gray-800 flex flex-col">
                <div class="bg-gray-900 border-b border-gray-800 px-3 py-1.5 text-[11px] font-bold text-gray-400">
                    <span class="text-white border-b-2 border-blue-500 pb-1">Positions (Active Pipeline)</span>
                </div>
                <div class="flex-1 overflow-auto text-xs">
                    <table class="w-full text-left font-mono">
                        <thead class="bg-gray-900 bg-opacity-40 text-gray-500 text-[10px] uppercase border-b border-gray-900">
                            <tr>
                                <th class="p-2">Ticket ID</th>
                                <th class="p-2">Type</th>
                                <th class="p-2">Volume</th>
                                <th class="p-2">Symbol</th>
                                <th class="p-2">Entry</th>
                                <th class="p-2">Current</th>
                                <th class="p-2 text-right">Profit / Loss</th>
                                <th class="p-2"></th>
                            </tr>
                        </thead>
                        <tbody id="open-positions-ledger" class="divide-y divide-gray-900 text-gray-300"></tbody>
                    </table>
                </div>
            </div>
        </main>

        <!-- Execution Panel Slip -->
        <aside class="bg-gray-950 border-l border-gray-800 p-4 flex flex-col justify-between">
            <div>
                <div class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-4 border-b border-gray-900 pb-2">Order Desk Ticket</div>
                <div>
                    <label class="block text-[10px] text-gray-500 uppercase font-bold mb-1">Volume (Standard Lots)</label>
                    <input type="number" id="tradeLots" value="1.00" step="0.1" min="0.01" class="w-full bg-black border border-gray-800 text-white rounded text-sm p-2 font-mono text-center focus:outline-none focus:border-blue-500">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-2 pb-2">
                <button onclick="commitOrder('SELL')" class="bg-red-900 hover:bg-red-600 text-white font-bold p-3 rounded transition flex flex-col items-center">
                    <span class="text-xs">SELL</span>
                    <span id="sl-price" class="text-sm font-mono mt-1">1.09419</span>
                </button>
                <button onclick="commitOrder('BUY')" class="bg-blue-900 hover:bg-blue-600 text-white font-bold p-3 rounded transition flex flex-col items-center">
                    <span class="text-xs">BUY</span>
                    <span id="by-price" class="text-sm font-mono mt-1">1.09421</span>
                </button>
            </div>
        </aside>
    </div>

    <script>
        const activeUserToken = localStorage.getItem('apex_active_session');
        if (!activeUserToken) window.location.href = 'login.html';

        let userDB = JSON.parse(localStorage.getItem('apex_users_db')) || {};
        let userProfile = userDB[activeUserToken];

        document.getElementById('hdr-user-id').innerText = activeUserToken;
        document.getElementById('hdr-leverage').innerText = userProfile.leverage || '1:50';

        let liveSpotPrice = 1.09421;
        let accountBalance = userProfile.balance;
        let openPositions = userProfile.positions || [];

        const canvasCtx = document.getElementById('mt5EngineChart').getContext('2d');
        const chartAsset = new Chart(canvasCtx, {
            type: 'line',
            data: { labels: Array.from({length: 20}, () => ''), datasets: [{ data: Array.from({length: 20}, () => 1.09421), borderColor: '#10b981', borderWidth: 1.5, pointRadius: 0, tension: 0.1, fill: false }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { position: 'right', ticks: { color: '#64748b' } } } }
        });

        function commitStateToStorage() {
            userProfile.balance = accountBalance;
            userProfile.positions = openPositions;
            userDB[activeUserToken] = userProfile;
            localStorage.setItem('apex_users_db', JSON.stringify(userDB));
        }

        setInterval(() => {
            liveSpotPrice += (Math.random() - 0.5) * 0.00006;
            document.getElementById('mt-eurusd').innerText = liveSpotPrice.toFixed(5);
            document.getElementById('current-candle-c').innerText = liveSpotPrice.toFixed(5);
            document.getElementById('sl-price').innerText = (liveSpotPrice - 0.00002).toFixed(5);
            document.getElementById('by-price').innerText = liveSpotPrice.toFixed(5);
            chartAsset.data.datasets[0].data.shift();
            chartAsset.data.datasets[0].data.push(liveSpotPrice);
            chartAsset.update('none');
            recalculatePositionsEngine();
        }, 700);

        function commitOrder(direction) {
            const lotQuantity = parseFloat(document.getElementById('tradeLots').value);
            openPositions.push({ ticket: Math.floor(100000 + Math.random() * 900000), type: direction, lots: lotQuantity, entryPrice: liveSpotPrice, pnl: 0.00 });
            commitStateToStorage();
            renderLedgerUI();
        }

        function closePosition(ticketId) {
            openPositions = openPositions.filter(pos => {
                if(pos.ticket === ticketId) { accountBalance += pos.pnl; return false; }
                return true;
            });
            commitStateToStorage();
            renderLedgerUI();
        }

        function recalculatePositionsEngine() {
            let totalRunningPnl = 0;
            openPositions.forEach(pos => {
                let diff = (liveSpotPrice - pos.entryPrice) * 10000;
                if (pos.type === 'SELL') diff = -diff;
                pos.pnl = diff * pos.lots * 10;
